# Configuración de Netlify para Creaciones Yulian.
# La página web vive en la carpeta "web".
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 22 para compilar y para las funciones (firebase-admin requiere Node 22+)
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"
  # firebase-admin se incluye tal cual (no se empaqueta) para evitar problemas.
  external_node_modules = ["firebase-admin"]

# Todas las rutas de la tienda las maneja la app (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
