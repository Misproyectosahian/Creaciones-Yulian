# Configuración de Netlify para Creaciones Yulian.
# La página web vive en la carpeta "web".
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Node 24 para compilar y para las funciones: firebase-admin 14 usa librerías
  # que solo son ESM (jose), y Node 24 las puede cargar con require().
  NODE_VERSION = "24"
  AWS_LAMBDA_JS_RUNTIME = "nodejs24.x"
  # La configuración web de Firebase y el ID del proyecto son PÚBLICOS (el navegador
  # los necesita), así que el detector de secretos de Netlify no debe bloquearlos.
  # La clave privada y los secretos de Cloudinary SÍ se siguen revisando.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,FIREBASE_PROJECT_ID,CLOUDINARY_CLOUD_NAME"

[functions]
  node_bundler = "esbuild"
  # firebase-admin se incluye tal cual (no se empaqueta) para evitar problemas.
  external_node_modules = ["firebase-admin"]

# Todas las rutas de la tienda las maneja la app (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
